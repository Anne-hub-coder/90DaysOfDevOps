<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to DevOps</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #43cea2);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    overflow: hidden;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 60px 50px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    max-width: 600px;
    animation: floatIn 1s ease-out;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 2.6em;
    color: #fff;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  h1 span {
    background: linear-gradient(90deg, #43cea2, #ffd200, #f7797d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  p.subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 1.1em;
    margin-bottom: 35px;
    letter-spacing: 0.5px;
  }

  .btn-group {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    padding: 14px 32px;
    font-size: 1em;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    background: linear-gradient(90deg, #f7797d, #FBD786, #C6FFDD);
    background-size: 200% auto;
  }

  .btn-primary:hover {
    background-position: right center;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(247, 121, 125, 0.4);
  }

  .btn-secondary {
    background: transparent;
    border: 2px solid rgba(255,255,255,0.6);
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(255,255,255,0.15);
  }

  .badge {
    display: inline-block;
    margin-top: 30px;
    padding: 6px 16px;
    font-size: 0.85em;
    color: #43cea2;
    background: rgba(67, 206, 162, 0.15);
    border: 1px solid rgba(67, 206, 162, 0.4);
    border-radius: 20px;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Welcome to <span>DevOps</span></h1>
    <h1>Zero to Hero</h1>
    <p class="subtitle">🚀 AI Powered Learning Journey</p>

    <div class="btn-group">
      <button class="btn-primary" onclick="alert(&#39;Let\&#39;s get started!&#39;)">Get Started</button>
      <button class="btn-secondary" onclick="alert(&#39;Explore the roadmap!&#39;)">Learn More</button>
    </div>

    <div class="badge">✨ Powered by AI</div>
  </div>



</body></html>
